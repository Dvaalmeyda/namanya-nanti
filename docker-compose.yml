services:
  ollama:
    image: ollama/ollama:latest
    container_name: pda-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - pda-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  model-puller:
    image: ollama/ollama:latest
    container_name: pda-model-puller
    restart: "no"
    networks:
      - pda-network
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./scripts/docker-init-models.sh:/init-models.sh:ro
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "/init-models.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pda-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/index:/app/data/index
    networks:
      - pda-network
    depends_on:
      ollama:
        condition: service_healthy
      model-puller:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: pda-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.docker
    networks:
      - pda-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_models:
    name: pda_ollama_models

networks:
  pda-network:
    name: pda-network
    driver: bridge
