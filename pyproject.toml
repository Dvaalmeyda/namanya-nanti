[project]
name = "personal-doc-assistant"
version = "0.1.0"
description = "Asisten AI lokal dan offline untuk tanya-jawab dokumen pribadi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-socket>=0.7.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost,::1"
