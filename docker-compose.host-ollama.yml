# ==============================================================================
# Konfigurasi Docker Compose untuk Mode Host Ollama
# Gunakan berkas ini jika Ollama sudah berjalan di komputer host (Windows/Linux/macOS)
# Jalankan: docker compose -f docker-compose.host-ollama.yml up -d
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pda-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/index:/app/data/index
    networks:
      - pda-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: pda-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.docker
    networks:
      - pda-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  pda-network:
    name: pda-network
    driver: bridge
